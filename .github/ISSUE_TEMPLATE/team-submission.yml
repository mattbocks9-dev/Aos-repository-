name: Submit a team to the shared library
description: Share a 5-player team so everyone can load it in the Pairing Trainer.
title: 'Team: '
labels: ['team-submission']
body:
  - type: markdown
    attributes:
      value: |
        Use **Team Setup → Submit this team to the shared library** in the app: it checks the team and fills in
        the data below. A maintainer reviews submissions; once approved, the team appears in everyone's
        "Load a saved team" list.

        Only the player names, factions and pasted lists are shared. Points always come from the BSData catalogue.
  - type: input
    id: team-name
    attributes:
      label: Team name
    validations:
      required: true
  - type: textarea
    id: team-data
    attributes:
      label: Team data
      description: Generated by the app. Paste it here if it isn't filled in already.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Event, meta, or anything else people should know about this team.
